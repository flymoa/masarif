<!doctype html>
<html lang="ary">
<head>
<meta charset="utf-8">
<title>Masarif · Animation dyal dekhla</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;family=Manrope:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes star-in{0%{transform:scale(0) rotate(-135deg);opacity:0}60%{transform:scale(1.12) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes spin-slow{from{transform:rotate(0)}to{transform:rotate(45deg)}}
@keyframes core-in{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ring{0%{transform:scale(0.6);opacity:0.6}100%{transform:scale(2.4);opacity:0}}
@keyframes bar{from{width:0}to{width:100%}}
.a-star{transform-origin:center;transform-box:fill-box;animation:star-in 900ms cubic-bezier(.2,.9,.3,1.2) both}
.a-star2{transform-origin:center;transform-box:fill-box;animation:star-in 900ms 120ms cubic-bezier(.2,.9,.3,1.2) both}
.a-core{transform-origin:center;transform-box:fill-box;animation:core-in 500ms 650ms cubic-bezier(.2,.9,.3,1.3) both}
.a-m{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 600ms 1000ms ease-out forwards}
.a-ring{transform-origin:center;transform-box:fill-box;animation:ring 1200ms 900ms ease-out both}
.a-word{animation:rise 600ms 1350ms ease-out both}
.a-tag{animation:fade 700ms 1750ms ease-out both}
.a-bar{animation:bar 1600ms 1800ms ease-in-out both}
@media (prefers-reduced-motion: reduce){.a-star,.a-star2,.a-core,.a-ring,.a-word,.a-tag,.a-bar{animation-duration:1ms;animation-delay:0ms}.a-m{stroke-dashoffset:0;animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #134232; font-family: Manrope, sans-serif; color: #FFFFFF">
  <sc-for list="{{runs}}" as="run" hint-placeholder-count="1">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
      <svg width="150" height="150" viewBox="-60 -60 120 120" role="img" aria-label="Logo Masarif">
        <circle class="a-ring" r="30" fill="none" stroke="#E9B949" stroke-width="2"></circle>
        <rect class="a-star" x="-34" y="-34" width="68" height="68" rx="7" fill="#E9B949"></rect>
        <g transform="rotate(45)"><rect class="a-star2" x="-34" y="-34" width="68" height="68" rx="7" fill="#E9B949"></rect></g>
        <g class="a-core">
          <circle r="24" fill="#134232"></circle>
          <circle r="16" fill="none" stroke="#E9B949" stroke-width="4"></circle>
        </g>
        <path class="a-m" d="M-7 7 L-7 -7 L0 1 L7 -7 L7 7" fill="none" stroke="#E9B949" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div class="a-word" style="font-family: Sora, sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.5px">Masarif</div>
      <div class="a-tag" style="font-size: 16px; color: #CFE0D6; text-align: center; line-height: 1.5">Kol dirham 3ndo blasto.</div>
    </div>
    <div style="position: absolute; left: 120px; right: 120px; bottom: 96px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden">
      <div class="a-bar" style="height: 4px; background: #E9B949; border-radius: 2px"></div>
    </div>
  </sc-for>

  <button type="button" onClick="{{replay}}" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; background: rgba(255,255,255,0.08); color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">↻ 3awd chouf l animation</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: 0 }; }
  renderVals() {
    return {
      runs: [{ id: this.state.n }],
      replay: () => this.setState({ n: this.state.n + 1 }),
    };
  }
}
</script>
</body>
</html>
